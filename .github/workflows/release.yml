name: Release

# Three modes, one workflow:
#   tag push      - build, verify, create a DRAFT release. A person publishes it.
#   workflow_dispatch - the rehearsal. Builds and verifies everything, touches no
#                   release. Run it before tagging; see RELEASING.md.
#   schedule      - the rehearsal, monthly, so an action bump or a retired runner
#                   image breaks on the first of a month instead of on release
#                   day. GitHub disables this after 60 days of repository
#                   inactivity, so the rehearsal, not the cron, is the guard.
on:
  push:
    tags: ['v*']
    # TEMPORARY, remove before merging to the default branch. workflow_dispatch
    # and schedule only offer a workflow that already exists on the default
    # branch, so until this is merged there is no other way to rehearse. A
    # branch push has ref_type "branch", so version-gate sets publish=false and
    # draft-release is skipped: this builds and verifies everything and cannot
    # create a release. It costs a full pipeline run on every push.
    branches: ['refaictoring']
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read

# Unlike ci.yml, a release run is never cancelled: a half-uploaded draft is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Linux packages are built in a container so the glibc floor is a decision
  # rather than a side effect of whichever runner image is current.
  LINUX_BUILD_IMAGE: ubuntu:22.04

jobs:
  version-gate:
    name: Version gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION and decide whether this run may publish
        id: read
        shell: bash
        run: |
          version=$(head -n1 VERSION | tr -d '[:space:]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must hold MAJOR.MINOR.PATCH, found '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Only a tag push may publish. A dispatch pointed at a tag would
          # otherwise satisfy a name-only check and recreate the draft.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "v$version" ]; then
              echo "tag ${{ github.ref_name }} does not match VERSION $version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version is consistent everywhere
        run: >-
          cmake -DEASY_SOURCE_DIR=$PWD
          -P tests/cmake/check_version_consistency.cmake

      - name: Test the changelog extractor
        run: python3 -m unittest tests/test_changelog_section.py

      # Release-day facts. On a branch the stable badge correctly names the
      # previous release and the changelog section is correctly Unreleased, so
      # these would make every commit and every cron run red.
      - name: Check the release is dated and the stable badge moved
        if: steps.read.outputs.publish == 'true'
        shell: bash
        run: |
          version='${{ steps.read.outputs.version }}'
          python3 scripts/changelog_section.py "$version" CHANGELOG.md --require-released > /dev/null
          cmake -DEASY_SOURCE_DIR="$PWD" -DEASY_RELEASED_VERSION="$version" \
            -P tests/cmake/check_version_consistency.cmake

      - name: Extract the release notes
        run: >-
          python3 scripts/changelog_section.py
          '${{ steps.read.outputs.version }}' CHANGELOG.md > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  source-archive:
    name: Source archive
    needs: version-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # git archive, not the GitHub auto-generated tarball: the bytes are
      # reproducible from the tag and the untracked working tree cannot leak in.
      # The Bazel Central Registry needs a stable archive with a fixed hash.
      - name: Create the archives
        shell: bash
        run: |
          version='${{ needs.version-gate.outputs.version }}'
          mkdir -p dist
          git archive --format=tar.gz --prefix="easy_profiler-$version/" \
            -o "dist/easy_profiler-$version-src.tar.gz" HEAD
          git archive --format=zip --prefix="easy_profiler-$version/" \
            -o "dist/easy_profiler-$version-src.zip" HEAD
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: dist

  bazel-source-check:
    name: Bazel module from the source archive
    needs: [version-gate, source-archive]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Consumes the archive the way a registry would, which also proves the
      # archive is complete.
      - name: Build and test the archive as a Bazel module
        shell: bash
        run: |
          version='${{ needs.version-gate.outputs.version }}'
          mkdir -p scratch && tar -xzf "dist/easy_profiler-$version-src.tar.gz" -C scratch
          cd "scratch/easy_profiler-$version"
          bazel test //tests:bazel_smoke
          bazel build //sample:easy_profiler_sample

  sdk:
    name: SDK (${{ matrix.name }})
    needs: version-gate
    runs-on: ${{ matrix.os }}
    # ubuntu:22.04 holds the glibc floor at 2.35 independently of the runner
    # image, which matters because ubuntu-22.04 runners retire in April 2027.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-shared
            os: ubuntu-24.04
            container: ubuntu:22.04
            shared: "ON"
            archive: tar.gz
          - name: linux-x86_64-static
            os: ubuntu-24.04
            container: ubuntu:22.04
            shared: "OFF"
            archive: tar.gz
          - name: macos-universal-shared
            os: macos-15
            container: ""
            shared: "ON"
            archive: tar.gz
          - name: macos-universal-static
            os: macos-15
            container: ""
            shared: "OFF"
            archive: tar.gz
          # Static MSVC requires the linker to be at least as new as the newest
          # toolset among its inputs, so the verify runner must not carry an
          # older Visual Studio than this one. windows-2025 and windows-2022
          # both ship VS 2022; moving this to windows-2025-vs2026 would break
          # the static verify cell.
          - name: windows-x64-shared
            os: windows-2025
            container: ""
            shared: "ON"
            archive: zip
          - name: windows-x64-static
            os: windows-2025
            container: ""
            shared: "OFF"
            archive: zip
    steps:
      - name: Install a toolchain in the container
        if: matrix.container != ''
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates
          ldd --version | head -1

      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/sdk
          -DEASY_PROFILER_NO_GUI=ON
          -DEASY_PROFILER_NO_SAMPLES=ON
          -DEASY_PROFILER_BUILD_READER=ON
          -DBUILD_TESTING=OFF
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DEASY_PROFILER_SOURCE_REVISION=${{ github.sha }}
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' || '' }}

      - name: Build
        run: cmake --build build/sdk --config RelWithDebInfo --parallel 4

      - name: Install into a staging prefix
        shell: bash
        run: >-
          cmake --install build/sdk --config RelWithDebInfo
          --prefix "stage/easy_profiler-${{ needs.version-gate.outputs.version }}-${{ matrix.name }}"

      # The linker ad-hoc signs only the native slice of a universal build, so
      # the x86_64 slice arrives unsigned and the strict verify below fails
      # without this. No certificate and no Apple account are involved.
      - name: Ad-hoc sign and verify every Mach-O
        if: runner.os == 'macOS'
        shell: bash
        run: |
          prefix="stage/easy_profiler-${{ needs.version-gate.outputs.version }}-${{ matrix.name }}"
          find "$prefix" -type f \( -perm +111 -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' file; do
              if file "$file" | grep -q 'Mach-O'; then
                codesign --force --sign - "$file"
                codesign --verify --strict "$file"
                echo "signed $file"
              fi
            done

      - name: Pack
        shell: bash
        run: |
          name="easy_profiler-${{ needs.version-gate.outputs.version }}-${{ matrix.name }}"
          mkdir -p dist
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            (cd stage && 7z a -tzip "../dist/$name.zip" "$name") > /dev/null
          else
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.name }}
          path: dist

  sdk-verify:
    name: Verify SDK (${{ matrix.name }} on ${{ matrix.os }})
    needs: [version-gate, sdk]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every cell runs on a different image from the one that built the
      # package, so build-host state cannot hide a defect. The macOS x86_64
      # slice is executed on an Intel runner for both linkage variants: a
      # consumer on arm64 links only the arm64 member of a fat archive, so
      # without an Intel cell the static package's x86_64 slice would never run.
      # When GitHub retires the Intel labels, drop x86_64 from the macOS
      # package rather than shipping a slice nothing executes.
      matrix:
        include:
          - name: linux-x86_64-shared
            os: ubuntu-26.04
            archive: tar.gz
          - name: linux-x86_64-static
            os: ubuntu-26.04
            archive: tar.gz
          - name: macos-universal-shared
            os: macos-26
            archive: tar.gz
          - name: macos-universal-shared
            os: macos-26-intel
            archive: tar.gz
          - name: macos-universal-static
            os: macos-26
            archive: tar.gz
          - name: macos-universal-static
            os: macos-26-intel
            archive: tar.gz
          - name: windows-x64-shared
            os: windows-2022
            archive: zip
          - name: windows-x64-static
            os: windows-2022
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.name }}
          path: dist

      - name: Unpack
        shell: bash
        run: |
          name="easy_profiler-${{ needs.version-gate.outputs.version }}-${{ matrix.name }}"
          mkdir -p unpacked
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            7z x -ounpacked "dist/$name.zip" > /dev/null
          else
            tar -xzf "dist/$name.tar.gz" -C unpacked
          fi
          cat "unpacked/$name/BUILD-INFO.txt"

      # Configures the repository's own test suite purely to register
      # easy_profiler.packaged_consumer against the unpacked prefix. The test
      # checks the contents, builds tests/consumer against the package, and then
      # runs the package's own bin/profiler_converter and bin/profiler_reader on
      # a profile the consumer wrote. That last step is the one that catches a
      # wrong install rpath; the consumer alone carries an absolute rpath and
      # would pass regardless.
      - name: Configure the package verification
        shell: bash
        run: >-
          cmake -S . -B build/verify
          -DEASY_PROFILER_NO_GUI=ON
          -DEASY_PROFILER_NO_SAMPLES=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DEASY_PROFILER_VERIFY_PACKAGE=$PWD/unpacked/easy_profiler-${{ needs.version-gate.outputs.version }}-${{ matrix.name }}"

      - name: Verify the package
        run: >-
          ctest --test-dir build/verify -C RelWithDebInfo
          --output-on-failure -R packaged_consumer

  gui-linux:
    name: GUI linux-x86_64
    needs: version-gate
    runs-on: ubuntu-24.04
    # The same container as the SDK packages, so the whole release has one
    # glibc floor; RELEASING.md, "Where the GUI bundle is built".
    container: ubuntu:22.04
    steps:
      # Current Qt requires CMake >= 3.25 and 22.04 ships 3.22.1, so CMake
      # comes from pip, pinned so the release is built by the version it was
      # tested with. The libraries past the compiler are what Qt's own .so
      # files link against; each was found by a build or a run failing without
      # it, libglib2.0-0 by rcc refusing to start.
      - name: Install a toolchain and Qt's own dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ make git ca-certificates python3-pip \
            libgl1-mesa-dev libxkbcommon-dev \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 libharfbuzz0b \
            libpng16-16 libb2-1 libdouble-conversion3 libpcre2-16-0 libzstd1 \
            libmd4c0 libgomp1
          pip3 install --quiet 'cmake==3.31.6'
          ldd --version | head -1
          cmake --version | head -1

      - uses: actions/checkout@v7

      # Whatever Qt 6 release is current, from the official packages: no
      # version is pinned anywhere, and only the official packages carry the
      # SBOM the notices are generated from. RELEASING.md, "Which Qt". aqtinstall
      # directly rather than install-qt-action, which expects a runner rather
      # than a bare container. --spec 6 is a compatibility bound, not a pin.
      - name: Resolve the current Qt
        id: qt
        run: |
          pip3 install --quiet aqtinstall
          version=$(python3 -m aqt list-qt linux desktop --spec 6 --latest-version)
          echo "Qt $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: qt
          key: qt-${{ steps.qt.outputs.version }}-linux-gcc_64-qt5compat

      # Qt Svg is in the base package; only qt5compat has to be asked for. That
      # matters because every toolbar icon is an SVG resource, and without the
      # SVG plugin the toolbars render empty with no error of any kind.
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >-
          python3 -m aqt install-qt linux desktop '${{ steps.qt.outputs.version }}'
          linux_gcc_64 -m qt5compat -O qt

      - name: Configure
        run: >-
          cmake -S . -B build/gui
          -DCMAKE_PREFIX_PATH="$PWD/qt/${{ steps.qt.outputs.version }}/gcc_64"
          -DEASY_PROFILER_NO_SAMPLES=ON
          -DEASY_PROFILER_BUILD_READER=ON
          -DEASY_PROFILER_REQUIRE_GUI=ON
          -DBUILD_TESTING=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/gui --parallel 4 --target profiler_gui

      # The licence texts, checksum-checked against scripts/qt_notices.sha256
      # and keyed by it: a rehearsal that fetched them spares the release from
      # reaching for code.qt.io.
      - name: Cache the licence texts
        uses: actions/cache@v4
        with:
          path: qt-notices-cache
          key: qt-notices-${{ hashFiles('scripts/qt_notices.sha256') }}-${{ steps.qt.outputs.version }}

      # qtpaths6 on PATH tells the script which Qt to copy and attribute.
      - name: Assemble the bundle
        shell: bash
        env:
          QT_NOTICES_CACHE: ${{ github.workspace }}/qt-notices-cache
        run: |
          export PATH="$PWD/qt/${{ steps.qt.outputs.version }}/gcc_64/bin:$PATH"
          bash scripts/make_gui_bundle.sh build/gui \
            "stage/easy_profiler_gui-${{ needs.version-gate.outputs.version }}-linux-x86_64"

      - name: Pack
        shell: bash
        run: |
          name="easy_profiler_gui-${{ needs.version-gate.outputs.version }}-linux-x86_64"
          mkdir -p dist && tar -C stage -czf "dist/$name.tar.gz" "$name"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: gui-linux-x86_64
          path: dist

  gui-verify-linux:
    name: Verify GUI linux-x86_64
    needs: [version-gate, gui-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No Qt is installed here. A container with nothing but the base system
    # proves the bundle carries what it needs: on the build runner the system
    # Qt would satisfy the binary whether the bundle were complete or not.
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gui-linux-x86_64
          path: dist

      # The ldd closure of the unpacked bundle minus what the bundle carries,
      # so it doubles as the answer to "what does the GUI need from the host".
      # The official Qt binaries link libglvnd, hence libopengl0 and libglx0.
      - name: Install only the host libraries the bundle expects, and Xvfb
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libfreetype6 libglib2.0-0 \
            libdbus-1-3 libegl1 libgl1 libglx0 libopengl0 ca-certificates xvfb
          # A bundle verified next to a system Qt proves nothing.
          ! dpkg -l | grep -qE '^ii +(qt6|libqt6)' || { echo "Qt is installed; this is not a clean check" >&2; exit 1; }

      - name: Unpack and self-test
        shell: bash
        run: |
          name="easy_profiler_gui-${{ needs.version-gate.outputs.version }}-linux-x86_64"
          mkdir -p unpacked && tar -xzf "dist/$name.tar.gz" -C unpacked
          cd "unpacked/$name"

          # xcb first: that is the plugin a user loads, and it is the one that
          # needs the host's X11 libraries to be present and the bundle's own
          # libQt6XcbQpa to have come along. Offscreen afterwards, because it
          # reaches the same Qt libraries and SVG plugins without an X server
          # and so is the check that stays meaningful if Xvfb ever breaks.
          # Bounded for the reason the Windows job's runs are: a self-test
          # takes seconds, and a GUI that stops making progress stops quietly.
          QT_QPA_PLATFORM=xcb timeout 120 xvfb-run -a ./run.sh --self-test
          QT_QPA_PLATFORM=offscreen timeout 120 ./run.sh --self-test

  gui-windows:
    name: GUI windows-x86_64
    needs: version-gate
    # Built on the older of the two current Windows images and verified on the
    # newer, for the same reason the Linux bundle is built in a 22.04 container
    # and verified on 24.04: the floor is then a decision rather than whatever
    # the runner happens to be. windows-2022 is the oldest image GitHub still
    # offers; when it is retired this has to move, and the bundle's floor moves
    # with it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Not the Linux one-liner: the newest Qt 6 cannot be installed here by
      # the current aqtinstall, and the script walks back to the newest that
      # can. Its header says why and when to delete it.
      - name: Resolve the current Qt
        id: qt
        shell: bash
        run: |
          python -m pip install --quiet aqtinstall
          version=$(python scripts/aqt_windows_workaround.py)
          echo "Qt $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: qt
          key: qt-${{ steps.qt.outputs.version }}-windows-msvc2022_64-qt5compat

      # Qt Svg is in the base package; only qt5compat has to be asked for.
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          python -m aqt install-qt windows desktop '${{ steps.qt.outputs.version }}'
          win64_msvc2022_64 -m qt5compat -O qt

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/gui
          -DCMAKE_PREFIX_PATH="$PWD/qt/${{ steps.qt.outputs.version }}/msvc2022_64"
          -DEASY_PROFILER_NO_SAMPLES=ON
          -DEASY_PROFILER_BUILD_READER=ON
          -DEASY_PROFILER_REQUIRE_GUI=ON
          -DBUILD_TESTING=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/gui --config RelWithDebInfo --parallel 4 --target profiler_gui

      - name: Cache the licence texts
        uses: actions/cache@v4
        with:
          path: qt-notices-cache
          key: qt-notices-${{ hashFiles('scripts/qt_notices.sha256') }}-${{ steps.qt.outputs.version }}

      # qtpaths6 and windeployqt both come off PATH, and both have to be the Qt
      # that built the binary; the script checks that the Qt6Core.dll it ended
      # up with is the version qtpaths6 claims.
      - name: Assemble the bundle
        shell: pwsh
        env:
          QT_NOTICES_CACHE: ${{ github.workspace }}/qt-notices-cache
          QT_VERSION: ${{ steps.qt.outputs.version }}
        run: |
          $env:PATH = "$PWD\qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          ./scripts/make_gui_bundle.ps1 build/gui `
            "stage/easy_profiler_gui-${{ needs.version-gate.outputs.version }}-windows-x86_64"

      # A zip rather than a tar.gz: Windows Explorer opens one without a tool.
      - name: Pack
        shell: pwsh
        run: |
          $name = "easy_profiler_gui-${{ needs.version-gate.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows-x86_64
          path: dist

  gui-verify-windows:
    name: Verify GUI windows-x86_64
    needs: [version-gate, gui-windows]
    # A different image than built it, and one with no Qt of its own: on the
    # build runner the Qt on PATH would satisfy the binary whether the bundle
    # were complete or not.
    runs-on: windows-2025
    # Nothing here should take minutes, and the first run of this job sat for
    # 37 of them before anyone looked: a GUI-subsystem process that cannot
    # start, or cannot finish, reports it through a window nobody can see.
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gui-windows-x86_64
          path: dist

      - name: Unpack and self-test
        shell: pwsh
        run: |
          $name = "easy_profiler_gui-${{ needs.version-gate.outputs.version }}-windows-x86_64"
          Expand-Archive -Path "dist/$name.zip" -DestinationPath unpacked
          Set-Location "unpacked/$name"

          # A bundle verified next to another Qt proves nothing, and on Windows
          # a DLL is resolved from PATH, so PATH is where a second Qt would be
          # found. Get-Command does not see DLLs, hence the explicit walk.
          $strays = $env:PATH -split ';' | Where-Object { $_ } |
            Where-Object { Test-Path (Join-Path $_ 'Qt6Core.dll') }
          if ($strays) { throw "a Qt is on PATH ($strays); this is not a clean check" }

          # profiler_gui is a GUI-subsystem executable with no console:
          # PowerShell does not wait for one and $LASTEXITCODE would be stale,
          # so Start-Process, with the redirections that make its fprintf
          # output visible at all.
          #
          # The wait is bounded rather than -Wait. A self-test takes seconds,
          # and anything that stops it on this runner - a missing DLL, a
          # fault, a window that never settles - stops it silently and
          # forever. The QPA logging is on for the same reason: a bounded wait
          # that reports nothing but the timeout says only that something
          # hung, not where.
          function Invoke-SelfTest($platform) {
            $env:QT_QPA_PLATFORM = $platform
            $env:QT_LOGGING_RULES = 'qt.qpa.*=true'
            $process = Start-Process -FilePath (Resolve-Path ./profiler_gui.exe) `
              -ArgumentList '--self-test' -PassThru -NoNewWindow `
              -RedirectStandardOutput "../../$platform.out" `
              -RedirectStandardError "../../$platform.err"
            $finished = $process.WaitForExit(120000)
            if (-not $finished) { $process.Kill($true) }
            Get-Content "../../$platform.out", "../../$platform.err" -ErrorAction SilentlyContinue
            if (-not $finished) {
              throw "the $platform self-test did not finish within two minutes"
            }
            if ($process.ExitCode -ne 0) {
              throw "the $platform self-test failed with exit code $($process.ExitCode)"
            }
          }

          # --self-test fails unless both SVG plugins loaded and the toolbar
          # icons rendered, which Qt otherwise reports nowhere.
          Invoke-SelfTest 'offscreen'

          # The real platform plugin is not exercised here, and cannot be. A
          # hosted Windows runner has no desktop session, and under
          # QT_QPA_PLATFORM=windows the self-test neither passed nor failed:
          # it produced no output at all, not even the QPA logging above, and
          # was killed at two minutes. The Linux job runs its real plugin
          # under Xvfb; Windows has nothing to stand in for one. RELEASING.md
          # carries this as a check a person makes before tagging.
          #
          # What a runner can still answer is the question the loader would
          # have answered: does every library in the bundle resolve what it
          # imports. Loading each one asks exactly that, window or no window,
          # and covers the plugins no self-test reaches - the TLS backends,
          # the network information plugin, the style.
          #
          # The bundle root goes on PATH because the plugins sit in
          # subdirectories while Qt6Gui.dll and the rest sit beside the
          # executable, which is where a real run finds them.
          $env:PATH = "$PWD;$env:PATH"
          $libraries = Get-ChildItem -Path . -Recurse -Filter *.dll -File
          $failures = @()
          foreach ($library in $libraries) {
            try {
              [System.Runtime.InteropServices.NativeLibrary]::Load($library.FullName) | Out-Null
            } catch {
              $name = Resolve-Path -Relative $library.FullName
              $failures += "$name : $($_.Exception.Message)"
            }
          }
          if ($failures) {
            throw ("these libraries do not load:`n  " + ($failures -join "`n  "))
          }
          Write-Host "all $($libraries.Count) libraries in the bundle resolve their imports"

  gui-build-check:
    name: GUI build check (${{ matrix.name }})
    needs: version-gate
    runs-on: ${{ matrix.os }}
    # A gate, not a product: the bundles come from gui-linux and gui-windows.
    # This asks whether the GUI compiles and runs against the Qt a person on
    # each platform would have, and is deliberately NOT on the draft-release
    # chain, so it cannot block a release over an artifact nobody downloads.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # The platform's own Qt where there is one: the distribution's on
          # Linux, also the oldest Qt 6 anything here is built against, and
          # Homebrew's on macOS. Windows has no system Qt, so that cell takes
          # the newest aqtinstall can install, as the Windows GUI job does.
          - name: linux-x86_64-distro-qt
            os: ubuntu-24.04
            qt: distro
          - name: macos-arm64-homebrew-qt
            os: macos-15
            qt: homebrew
          - name: windows-x64-aqt
            os: windows-2025
            qt: aqt
    steps:
      - uses: actions/checkout@v7

      # The three install steps leave CMAKE_PREFIX_PATH in the environment,
      # where CMake reads it, so the configure step is the same for all three.
      - name: Install the distribution's Qt
        if: matrix.qt == 'distro'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-svg-dev libgl1-mesa-dev
          qtpaths6 --query QT_VERSION

      # The three modules the GUI uses, rather than the qt meta-formula that
      # pulls in all of Qt down to WebEngine. qt5compat brings qtdeclarative
      # along; nothing to be done about that. The macOS floor of 6.9.2
      # (QTBUG-137687, see README.md) is met by Homebrew as a matter of
      # course, since it ships the current release.
      - name: Install Homebrew's Qt
        if: matrix.qt == 'homebrew'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install qtbase qtsvg qt5compat
          "$(brew --prefix qtbase)/bin/qtpaths6" --query QT_VERSION
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qtbase):$(brew --prefix qtsvg):$(brew --prefix qt5compat)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: matrix.qt == 'aqt'
        with:
          python-version: '3.12'

      # aqtinstall directly, as the bundle jobs and RELEASING.md do: one way
      # to obtain Qt. install-qt-action did not run on windows-2025 when
      # tried; RELEASING.md has the detail.
      - name: Install Qt with aqtinstall
        if: matrix.qt == 'aqt'
        shell: bash
        run: |
          python -m pip install --quiet aqtinstall
          version=$(python scripts/aqt_windows_workaround.py)
          echo "Qt $version"
          python -m aqt install-qt windows desktop "$version" win64_msvc2022_64 \
            -m qt5compat -O "$PWD/qt"
          test -d "$PWD/qt/$version/msvc2022_64"
          # pwd -W: a Windows path for CMake, where bash's /d/a/... form is
          # only translated on a command line, not in an environment value.
          echo "CMAKE_PREFIX_PATH=$(pwd -W)/qt/$version/msvc2022_64" >> "$GITHUB_ENV"
          # The self-test loads Qt6*.dll from PATH; CMAKE_PREFIX_PATH is for
          # CMake alone. easy_profiler.dll is built next to the executable.
          echo "$(pwd -W)/qt/$version/msvc2022_64/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/gui
          -DEASY_PROFILER_NO_SAMPLES=ON
          -DEASY_PROFILER_REQUIRE_GUI=ON
          -DBUILD_TESTING=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/gui --config RelWithDebInfo --parallel 4 --target profiler_gui

      - name: Self-test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe=$(find build/gui -name 'profiler_gui' -o -name 'profiler_gui.exe' | head -1)
          "$exe" --self-test

  checksums:
    name: Checksums
    needs: [version-gate, source-archive, bazel-source-check, sdk, sdk-verify,
            gui-linux, gui-verify-linux, gui-windows, gui-verify-windows]
    runs-on: ubuntu-24.04
    env:
      # The release, asset by asset, as <artifact>/<file>. Exactly these are
      # published: a listed file that is missing fails the run, and a file a
      # job uploaded but nobody listed is left out. To leave a product out of
      # a release, delete its line here and its build and verify jobs from
      # `needs` above, together. See RELEASING.md.
      ASSETS: |
        source-archive/easy_profiler-${{ needs.version-gate.outputs.version }}-src.tar.gz
        source-archive/easy_profiler-${{ needs.version-gate.outputs.version }}-src.zip
        sdk-linux-x86_64-shared/easy_profiler-${{ needs.version-gate.outputs.version }}-linux-x86_64-shared.tar.gz
        sdk-linux-x86_64-static/easy_profiler-${{ needs.version-gate.outputs.version }}-linux-x86_64-static.tar.gz
        sdk-macos-universal-shared/easy_profiler-${{ needs.version-gate.outputs.version }}-macos-universal-shared.tar.gz
        sdk-macos-universal-static/easy_profiler-${{ needs.version-gate.outputs.version }}-macos-universal-static.tar.gz
        sdk-windows-x64-shared/easy_profiler-${{ needs.version-gate.outputs.version }}-windows-x64-shared.zip
        sdk-windows-x64-static/easy_profiler-${{ needs.version-gate.outputs.version }}-windows-x64-static.zip
        gui-linux-x86_64/easy_profiler_gui-${{ needs.version-gate.outputs.version }}-linux-x86_64.tar.gz
        gui-windows-x86_64/easy_profiler_gui-${{ needs.version-gate.outputs.version }}-windows-x86_64.zip
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Collect the listed assets and hash them
        shell: bash
        run: |
          mkdir -p dist
          missing=0
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if [ -f "downloaded/$asset" ]; then
              cp "downloaded/$asset" dist/
            else
              echo "::error::release asset $asset was not built"
              missing=1
            fi
          done <<< "$ASSETS"
          test "$missing" -eq 0

          while IFS= read -r file; do
            relative=${file#downloaded/}
            if ! grep -qxF "$relative" <<< "$ASSETS"; then
              echo "::warning::$relative was built but is not in the release"
            fi
          done < <(find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \))

          cp downloaded/release-notes/release-notes.md .
          cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist
            release-notes.md

  draft-release:
    name: Draft release
    needs: [version-gate, checksums]
    if: needs.version-gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checked out for .github/release-footer.md, which is appended to the
      # changelog section to make the release body.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      # Free, no secret and no certificate: a Sigstore-signed statement that
      # these files came out of this workflow at this commit. Works in a fork
      # the same way, because nothing here needs a repository secret.
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create or replace the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          version='${{ needs.version-gate.outputs.version }}'

          # A draft has no public URL, so replacing it wholesale is cheaper and
          # safer than clobbering assets one at a time: gh release upload
          # --clobber deletes the old asset before uploading the new one. A
          # published release is never touched.
          if gh release view "$tag" --json isDraft --jq .isDraft > state 2>/dev/null; then
            if [ "$(cat state)" != "true" ]; then
              echo "release $tag is already published; refusing to modify it" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi

          cat release-notes.md .github/release-footer.md > body.md

          gh release create "$tag" \
            --draft \
            --title "easy_profiler $version" \
            --notes-file body.md \
            --verify-tag \
            dist/*

          echo "Draft created. Inspect it, then publish by hand." >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
